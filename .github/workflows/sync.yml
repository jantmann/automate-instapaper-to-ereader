name: Substack to Instapaper

on:
  schedule:
    - cron: "30 11 * * *"  # 6:30 AM EST
    - cron: "30 12 * * *"  # 7:30 AM EST
    - cron: "30 13 * * *"  # 8:30 AM EST
    - cron: "30 14 * * *"  # 9:30 AM EST
    - cron: "30 15 * * *" # 10:30 AM EST
  workflow_dispatch:        # allows manual runs from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        run: python main.py